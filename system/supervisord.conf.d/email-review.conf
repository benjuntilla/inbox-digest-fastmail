# Inbox Digest & Review: browses the email-digest skill's classification of
# recent mail from Fastmail.
[program:email-review]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/forward_port.py --manifest system/apps/email_review/app.toml --url http://localhost:8091 && exec email-review"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/email-review-stdout.log
stderr_logfile=/var/log/supervisor/email-review-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
